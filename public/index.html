    <script src="/markup-overlays.js"></script>

    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="المحادثات">
        <div class="brand">
          <div class="arc-reactor-hud">
            <div class="arc-outer-ring"></div>
            <div class="arc-middle-ring"></div>
            <div class="arc-inner-core"></div>
          </div>
          <span>SANAD AI · سند</span>
        </div>

        <button class="btn btn-primary" id="newChat" type="button"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg><span>محادثة جديدة</span></button>

        <details class="tool-nav" id="toolNav" open>
          <summary class="tool-nav-head"><span>الأدوات</span><span class="chev" aria-hidden="true">▾</span></summary>

          <div class="tool-group-label">النظام</div>
          <div class="tool-grid">
            <button class="tool-item" id="sysStatsBtn" type="button" title="نبض وموارد النظام (CPU, RAM, Disk, Health)">
            <span class="tool-ico"><svg class="ico" aria-hidden="true"><use href="#i-activity"/></svg></span>
            <span class="tool-label">نبض النظام</span>
          </button>
            <button class="tool-item" id="netMaestroBtn" type="button" title="الشبكة والمنافذ (Ports, Ping, IP)">
            <span class="tool-ico"><svg class="ico" aria-hidden="true"><use href="#i-globe"/></svg></span>
            <span class="tool-label">الشبكة</span>
          </button>
            <button class="tool-item" id="desktopManagerBtn" type="button" title="إدارة وأتمتة سطح المكتب وتصنيف الملفات">
            <span class="tool-ico"><svg class="ico" aria-hidden="true"><use href="#i-monitor"/></svg></span>
            <span class="tool-label">سطح المكتب</span>
          </button>
            <button class="tool-item" id="terminalBtn" type="button" title="الطرفية البرمجية المباشرة (Terminal Console)">
            <span class="tool-ico"><svg class="ico" aria-hidden="true"><use href="#i-terminal"/></svg></span>
            <span class="tool-label">الطرفية</span>
          </button>
          </div>

          <div class="tool-group-label">الشاشة</div>
          <div class="tool-grid">
            <button class="tool-item" id="topScreenVisionBtn" type="button" title="عيون سند: التقاط وتحليل الشاشة الحية فوراً">
            <span class="tool-ico"><svg class="ico" aria-hidden="true"><use href="#i-eye"/></svg></span>
            <span class="tool-label">فحص الشاشة</span>
          </button>
            <button class="tool-item" id="liveStreamBtn" type="button" title="وضع البث المباشر للشاشة مع المساعد سند والتحكم بزر الفأرة">
            <span class="tool-ico"><svg class="ico" aria-hidden="true"><use href="#i-radio"/></svg></span>
            <span class="tool-label" id="liveStreamLabel">بث مباشر</span>
          </button>
            <button class="tool-item" id="toggleIslandBtn" type="button" title="وضع الكبسولة العائمة الذكية (Dynamic Island)">
            <span class="tool-ico"><svg class="ico" aria-hidden="true"><use href="#i-island"/></svg></span>
            <span class="tool-label">العرض المصغّر</span>
          </button>
          </div>

          <div class="tool-group-label">الإنتاجية</div>
          <div class="tool-grid">
            <button class="tool-item" id="memoryBtn" type="button" title="الذاكرة الدائمة المحلية (Long-Term Memory)">
            <span class="tool-ico"><svg class="ico" aria-hidden="true"><use href="#i-memory"/></svg></span>
            <span class="tool-label">الذاكرة</span>
            <span class="tool-count" id="memoryCount">4</span>
          </button>
            <button class="tool-item" id="tasksBtn" type="button" title="المهام المستقلة والعمل أثناء الغياب (Autonomous Tasks)">
            <span class="tool-ico"><svg class="ico" aria-hidden="true"><use href="#i-clock"/></svg></span>
            <span class="tool-label">المهام</span>
            <span class="tool-count" id="tasksCount">2</span>
          </button>
            <button class="tool-item" id="workflowsBtn" type="button" title="المسارات والإجراءات الحركية المحفوظة سريعة التنفيذ (Cached Workflows)">
            <span class="tool-ico"><svg class="ico" aria-hidden="true"><use href="#i-zap"/></svg></span>
            <span class="tool-label">المسارات</span>
            <span class="tool-count" id="workflowsCount">2</span>
          </button>
            <button class="tool-item" id="projectPreviewBtn" type="button" title="معاينة المشاريع البرمجية الحية وتطبيقات الويب">
            <span class="tool-ico"><svg class="ico" aria-hidden="true"><use href="#i-code"/></svg></span>
            <span class="tool-label">المشاريع</span>
          </button>
            <button class="tool-item" id="extensionsBtn" type="button" title="الإضافات: ميزات كتبها سند لنفسه بطلب منك">
            <span class="tool-ico settings-ico app-purple"><svg class="ico" aria-hidden="true"><use href="#i-puzzle"/></svg></span>
            <span class="tool-label">الإضافات</span>
          </button>
          </div>
        </details>

        <nav class="conv-list" id="convList" aria-label="قائمة المحادثات"></nav>

        <div class="stats" id="stats"></div>

        <div class="side-foot">
          <button class="btn" id="theme" type="button" title="تبديل المظهر"><svg class="ico" aria-hidden="true"><use href="#i-moon"/></svg><span>الوضع الداكن</span></button>
          <button class="icon-btn" id="closeNav" type="button" title="إغلاق القائمة" aria-label="إغلاق القائمة"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button>
        </div>
      </aside>

      <div class="backdrop hidden" id="backdrop"></div>

      <main class="chat">
        <header class="chat-head">
          <button class="icon-btn menu-btn" id="openNav" type="button" aria-label="فتح المحادثات" aria-controls="sidebar" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg></button>

          <div class="arc-reactor-hud" id="arcReactorHud" title="نواة سند العصبية (SANAD Core)">
            <div class="arc-outer-ring"></div>
            <div class="arc-middle-ring"></div>
            <div class="arc-inner-core"></div>
            <div class="arc-pulse-wave"></div>
          </div>

          <div class="head-titles">
            <h1 id="convTitle">سند · النظام المستقل</h1>
            <p id="convMeta">جاهز لتنفيذ الأوامر وتقديم الدعم المباشر</p>
          </div>

          <button class="jarvis-voice-btn brain-badge" id="brainBadge" type="button" title="وضع العمل — انقر للتبديل بين «باتصال» و«دون اتصال»">
            <span class="brain-dot" id="brainBadgeDot"></span>
            <span class="btn-label" id="brainBadgeText">جارٍ الفحص...</span>
          </button>

          <button class="jarvis-voice-btn palette-trigger" id="paletteBtn" type="button" title="لوحة الأوامر — ابحث عن أي أداة (Ctrl+K)" aria-haspopup="dialog" aria-controls="paletteBackdrop">
            <svg class="ico" aria-hidden="true"><use href="#i-command"/></svg>
            <span class="btn-label">الأوامر</span>
            <kbd class="kbd">Ctrl K</kbd>
          </button>


          <div class="model-picker" id="modelPicker">
            <button
              class="model-btn"
              id="modelBtn"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="modelPanel"
            >
              <span class="model-btn-text">
                <span class="model-btn-name" id="modelBtnName">الافتراضي</span>
                <span class="model-btn-meta" id="modelBtnMeta">جاري تحميل الموديلات…</span>
              </span>
              <span class="chev" aria-hidden="true">▾</span>
            </button>

            <div class="model-panel hidden" id="modelPanel">
              <input
                class="model-search"
                id="modelSearch"
                type="search"
                placeholder="ابحث بالاسم أو المزوّد…"
                autocomplete="off"
                aria-label="بحث في الموديلات"
              />
              <div class="model-list" id="modelList" role="listbox" aria-label="الموديلات المجانية المتاحة"></div>
              <div class="model-foot" id="modelFoot"></div>
            </div>
          </div>
        </header>

        <div class="drop-overlay hidden" id="dropOverlay">
          <span>📄 أفلت الملفات هنا ليقرأها سند</span>
        </div>

        <div class="thread" id="thread" role="log" aria-label="المحادثة"></div>

        <div class="sr-only" id="announcer" aria-live="polite"></div>

        <form class="composer" id="form">
          <div class="attachment-bar hidden" id="attachmentBar"></div>
          <div class="composer-inner">
            <input type="file" id="fileInput" class="sr-only" multiple accept=".pdf,.txt,.md,.json,.js,.ts,.py,.html,.css,.csv,.log,.sql" />
            <button class="attach-btn" id="attachBtn" type="button" aria-label="إرفاق ملف" title="إرفاق ملفات أو مستندات أو PDF من جهازك"><svg class="ico" aria-hidden="true"><use href="#i-paperclip"/></svg></button>
            <button class="attach-btn" id="screenVisionBtn" type="button" aria-label="فحص الشاشة" title="عيون سند: انظر إلى شاشتي وافحصها (Live Screen Vision)"><svg class="ico" aria-hidden="true"><use href="#i-eye"/></svg></button>
            <label class="sr-only" for="prompt">رسالتك</label>
            <textarea id="prompt" rows="1" placeholder="اكتب رسالتك لسند…" title="Enter للإرسال · Shift+Enter لسطر جديد · يمكنك سحب ملف إلى هنا"></textarea>
            <div class="composer-actions">
              <button class="send" id="send" type="submit" aria-label="إرسال"><svg class="ico" aria-hidden="true"><use href="#i-arrow-up"/></svg></button>
              <button class="stop hidden" id="stop" type="button" aria-label="إيقاف"><svg class="ico" aria-hidden="true"><use href="#i-stop"/></svg></button>
            </div>
          </div>
          <div class="foot-note">
            كل الموديلات المجانية من
            <a href="https://openrouter.ai/models?variant=free" target="_blank" rel="noreferrer">OpenRouter</a>
            · الردود قد تكون غير دقيقة
          </div>
        </form>
      </main>
    </div>

    <script src="/markup-modals.js"></script>

    <script src="/ios-notify.js"></script>
    <script src="/extensions-runtime.js"></script>
    <script src="/home.js"></script>
    <script src="/chat-core.js"></script>
    <script src="/models-ui.js"></script>
    <script src="/audio-fx.js"></script>
    <script src="/attachments.js"></script>
    <script src="/memory-ui.js"></script>
    <script src="/terminal-ui.js"></script>
    <script src="/tasks-ui.js"></script>
    <script src="/workflows-ui.js"></script>
    <script src="/vision-ui.js"></script>
    <script src="/visual-agent.js"></script>
    <script src="/live-stream.js"></script>
