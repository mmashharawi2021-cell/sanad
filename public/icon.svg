<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="1"/>
      <stop offset="40%" stop-color="#4facfe" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#000d2b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050813" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Dark Disc -->
  <rect width="512" height="512" rx="128" fill="#0b101b"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <!-- Outer HUD Tick Marks -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00f2fe" stroke-width="3" stroke-dasharray="16, 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#4facfe" stroke-width="1.5" stroke-dasharray="4, 6" opacity="0.4"/>

  <!-- Core Reactor Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="10" filter="url(#neonBlur)"/>
  
  <!-- Arc segments -->
  <path d="M 256 76 A 180 180 0 0 1 436 256" fill="none" stroke="#00f2fe" stroke-width="6" stroke-linecap="round"/>
  <path d="M 256 436 A 180 180 0 0 1 76 256" fill="none" stroke="#38ef7d" stroke-width="6" stroke-linecap="round"/>

  <!-- Inner Hexagon -->
  <polygon points="256,160 339,208 339,304 256,352 173,304 173,208" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="4"/>

  <!-- Center Glowing Core -->
  <circle cx="256" cy="256" r="45" fill="#ffffff" filter="url(#neonBlur)"/>
  <circle cx="256" cy="256" r="30" fill="#00f2fe"/>
  <circle cx="256" cy="256" r="15" fill="#ffffff"/>
</svg>